<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Used Car Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Used Car Price Predictor</h1>
            <p class="subtitle">Enter car details to get an estimated price in PKR</p>
        </header>

        <div class="form-grid">
            <!-- Dropdowns -->
            <div class="form-group">
                <label for="make">Make (Company)</label>
                <select id="make">
                    {% for item in options["make"] %}
                    <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="model">Model</label>
                <select id="model">
                    {% for item in options["model"] %}
                    <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="fuel_type">Fuel Type</label>
                <select id="fuel_type">
                    {% for item in options["fuel_type"] %}
                    <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="transmission">Transmission</label>
                <select id="transmission">
                    {% for item in options["transmission"] %}
                    <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="body_type">Body Type</label>
                <select id="body_type">
                    {% for item in options["body_type"] %}
                    <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <select id="city">
                    {% for item in options["city"] %}
                    <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Sliders -->
            <div class="form-group slider-group">
                <label for="year">Year: <span id="year_val">2018</span></label>
                <input type="range" id="year" min="1990" max="2026" value="2018">
            </div>

            <div class="form-group slider-group">
                <label for="mileage_km">Mileage (km): <span id="mileage_km_val">50,000</span></label>
                <input type="range" id="mileage_km" min="0" max="500000" step="1000" value="50000">
            </div>

            <div class="form-group slider-group">
                <label for="engine_cc">Engine (cc): <span id="engine_cc_val">1,300</span></label>
                <input type="range" id="engine_cc" min="600" max="5000" step="100" value="1300">
            </div>
        </div>

        <button id="predict-btn">Predict Price</button>

        <div id="result-card" class="result-card hidden">
            <p class="result-label">Estimated Price</p>
            <p class="result-price" id="result-price"></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
